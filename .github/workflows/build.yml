name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install audio headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # X11 screen and window capture against a virtual X server (skipped above: no DISPLAY).
      - name: Stream capture tests (Xvfb)
        run: sudo apt-get install -y xvfb && xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" cargo test -p celerity-stream --lib capture::linux

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            ext: .exe
          - os: macos-latest
            name: macos
            ext: ""
          - os: ubuntu-latest
            name: linux
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install audio headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress && echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      # The platform encoders (Media Foundation, VideoToolbox), window capture and stream audio
      # only run here; their output must decode with OpenH264.
      - name: Test the streaming engine
        if: runner.os != 'Linux'
        run: cargo test -p celerity-stream --release -- --nocapture
      - run: cargo build --release
      - name: Collect binaries
        shell: bash
        run: |
          mkdir dist
          cp target/release/celerity${{ matrix.ext }} dist/
          cp target/release/celerity-server${{ matrix.ext }} dist/
      - uses: actions/upload-artifact@v4
        with:
          name: celerity-${{ matrix.name }}
          path: dist/
