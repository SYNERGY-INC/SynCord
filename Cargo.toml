[workspace]
resolver = "3"
members = ["crates/proto", "crates/server", "crates/client", "crates/update", "crates/video", "crates/stream"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
celerity-proto = { path = "crates/proto" }
celerity-update = { path = "crates/update" }
celerity-video = { path = "crates/video" }
celerity-stream = { path = "crates/stream" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.9"

# Small, fast release binaries.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Smaller debug builds (full debug info made target/ huge); backtraces still show lines.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
