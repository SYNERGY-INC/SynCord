[package]
name = "celerity-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "celerity"
path = "src/main.rs"

[dependencies]
celerity-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
toml.workspace = true
iced = { version = "0.14", features = ["tokio", "svg", "image", "advanced"] }
iced_renderer = "0.14"
iced_wgpu = "0.14"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
cpal = "0.18"
opus = "0.4"
nnnoiseless = { version = "0.5", default-features = false }
# Images, GIFs, uploads, emoji
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
webpki-roots = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Already used by iced for text; listing installed fonts and reading font files.
fontdb = "0.23"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
emojis = "0.9"
celerity-update.workspace = true
celerity-video = { workspace = true, features = ["playback"] }
celerity-stream = { workspace = true }

# The tray icon (Linux would need GTK libraries for it, so there closing just quits).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26"

# Time since the last key press or mouse move anywhere on the computer (for going idle).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }

[dev-dependencies]
celerity-server = { path = "../server" }
axum = "0.8"

[build-dependencies]
winresource = "0.1"
