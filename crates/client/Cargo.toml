[package]
name = "syncord-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "syncord"
path = "src/main.rs"

[dependencies]
syncord-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
toml.workspace = true
iced = { version = "0.14", features = ["tokio", "svg", "image"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
cpal = "0.18"
opus = "0.4"
nnnoiseless = { version = "0.5", default-features = false }
# Images, GIFs, uploads, emoji
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
webpki-roots = "1"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
emojis = "0.9"
syncord-update.workspace = true

[dev-dependencies]
syncord-server = { path = "../server" }
axum = "0.8"

[build-dependencies]
winresource = "0.1"
