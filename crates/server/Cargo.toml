[package]
name = "syncord-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
syncord-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

syncord-update.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Encrypted connections: a self-signed certificate made on first start.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
sha2 = "0.10"

[dev-dependencies]
tokio-tungstenite = "0.28"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }

[build-dependencies]
winresource = "0.1"
