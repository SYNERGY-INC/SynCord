[package]
name = "celerity-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Live video for Celerity voice calls: camera and screen capture, H.264 encode/decode, datagram packets"

[features]
default = ["capture", "hardware"]
# Hardware H.264 encoding (Media Foundation on Windows, VideoToolbox on macOS), self-tested
# against OpenH264 and falling back to it. Nothing on Linux.
hardware = [
    "dep:windows",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-core-foundation",
    "dep:objc2-video-toolbox",
]
# Camera, screen and stream audio capture backends (Media Foundation + DXGI + Windows.Graphics.
# Capture + WASAPI on Windows, AVFoundation + ScreenCaptureKit on macOS, V4L2 + X11 + PulseAudio
# on Linux). Without it the crate is codec + packets only.
capture = [
    "dep:windows",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-av-foundation",
    "dep:objc2-screen-capture-kit",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-core-graphics",
    "dep:objc2-core-foundation",
    "dep:block2",
    "dep:dispatch2",
    "dep:x11rb",
    "dep:libc",
    "dep:zune-jpeg",
    "dep:libloading",
]

[dependencies]
# Same OpenH264 build as celerity-video (compiled once from bundled C++ source with `cc`).
openh264-sys2 = { version = "0.9", default-features = false, features = ["source"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSObject",
    "NSString",
    "NSValue",
] }
objc2-av-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "objc2-core-media",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVCaptureVideoDataOutput",
    "AVMediaFormat",
] }
objc2-screen-capture-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "libc",
    "objc2-core-foundation",
    "objc2-core-media",
    "objc2-core-graphics",
    "SCShareableContent",
    "SCStream",
] }
objc2-core-media = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "objc2-core-video",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
    "CMBase",
    "CMSync",
] }
objc2-core-video = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-core-graphics = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGWindow",
] }
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-video-toolbox = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "objc2-core-media",
    "objc2-core-video",
    "VTBase",
    "VTCompressionProperties",
    "VTCompressionSession",
    "VTErrors",
    "VTSession",
    "VTVideoEncoderList",
] }
block2 = { version = "0.6", optional = true }
dispatch2 = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Pure Rust X11 protocol (already used by the GUI stack); MIT-SHM for fast screen grabs.
x11rb = { version = "0.13", optional = true, features = ["shm", "randr", "xfixes", "composite"] }
libc = { version = "0.2", optional = true }
# MJPEG webcams (720p30 is MJPEG-only on most UVC cameras). Same decoder the `image` crate uses.
zune-jpeg = { version = "0.5", optional = true }
# libpulse-simple for stream audio, opened at run time so there is no build/link dependency.
libloading = { version = "0.8", optional = true }

[[example]]
name = "bench"

[[example]]
name = "capture"
required-features = ["capture"]
