<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C7DFF"/>
      <stop offset="1" stop-color="#8B4DFF"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <!-- The C: a thick ring, open on the right, as if moving left to right -->
  <path d="M361 173 A112 112 0 1 0 361 339" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round"/>
  <!-- Speed streaks behind it -->
  <rect x="60" y="206" width="70" height="20" rx="10" fill="url(#streak)"/>
  <rect x="40" y="246" width="90" height="20" rx="10" fill="url(#streak)"/>
  <rect x="68" y="286" width="62" height="20" rx="10" fill="url(#streak)"/>
  <!-- A spark at the open end: voice -->
  <circle cx="376" cy="256" r="24" fill="#FFFFFF"/>
</svg>
